name: Build and Push Docker Image

on:
  push:
    branches: [ main, project ]
    paths:
      - api/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-flags: --debug

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mr-moreintenso:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mr-moreintenso:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mr-moreintenso:cache,mode=max